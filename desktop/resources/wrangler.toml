name = "p2p-relay"
main = "p2p-worker.js"
compatibility_date = "2024-11-01"

# 房间用 Durable Object 实现：同房间的连接由同一个 DO 实例托管，
# 这样两个客户端才真的能在一个会话里互相转发。
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 免费额度要求 DO 用 SQLite 存储后端，必须声明 new_sqlite_classes
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
